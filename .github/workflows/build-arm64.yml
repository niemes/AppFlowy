name: build-arm64

# Builds AppFlowy natively for linux-aarch64 on GitHub-hosted ARM64 runners
# and uploads the app bundle (tar.gz) as a downloadable artifact.
#
# ARM64 runners (ubuntu-24.04-arm) are free for public repos and have 16GB+
# of RAM, so the Flutter + RocksDB + Rust release build completes without
# the memory pressure that kills it on small machines.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "AppFlowy version to bake into the package (e.g. 0.14.0)"
        required: true
        default: "0.14.0"
      flutter_version:
        description: "Flutter version to build with"
        required: true
        default: "3.27.4"

jobs:
  build-linux-arm64:
    name: Linux ARM64
    runs-on: ubuntu-24.04-arm
    env:
      FLUTTER_VERSION: ${{ github.event.inputs.flutter_version }}
      RUST_TOOLCHAIN: "1.85.0"
      APP_VERSION: ${{ github.event.inputs.version }}
      LINUX_APP_RELEASE_PATH: frontend/appflowy_flutter/product/${{ github.event.inputs.version }}/linux/Release
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Flutter (from source, ARM64)
        # subosito/flutter-action can't resolve linux-arm64 archives (they're x64-only
        # in Flutter's release channel), so git-clone the SDK and let it fetch the
        # linux-arm64 engine at build time.
        shell: bash
        run: git clone --depth 1 --branch ${{ env.FLUTTER_VERSION }} https://github.com/flutter/flutter.git "$HOME/flutter"

      - name: Add Flutter to PATH
        shell: bash
        run: echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Verify Flutter (ARM64)
        shell: bash
        run: flutter --version

      - name: Install Rust toolchain (arm64)
        shell: bash
        run: |
          rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal --component rustfmt
          rustup default ${{ env.RUST_TOOLCHAIN }}
          rustup target add aarch64-unknown-linux-gnu
          rustc -vV | grep host

      - name: Verify we are building for ARM64
        run: |
          echo "runner arch: $(uname -m)"
          rustc -vV | grep host
          flutter --version | head -1

      - name: Install prerequisites
        working-directory: frontend
        run: |
          sudo wget -qO /etc/apt/trusted.gpg.d/dart_linux_signing_key.asc https://dl-ssl.google.com/linux/linux_signing_key.pub
          sudo wget -qO /etc/apt/sources.list.d/dart_stable.list https://storage.googleapis.com/download.dartlang.org/linux/debian/dart_stable.list
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev libssl-dev clang cmake ninja-build pkg-config libgtk-3-dev libcurl4-openssl-dev keybinder-3.0 libnotify-dev
          source $HOME/.cargo/env
          cargo install --force --locked cargo-make
          cargo install --force --locked duckscript_cli
          rustup target add aarch64-unknown-linux-gnu

      - name: Build AppFlowy (ARM64)
        working-directory: frontend
        run: |
          # Ensure protoc-gen-dart (installed by `dart pub global activate protoc_plugin`,
          # which cargo-make runs during the build) is on PATH for the Rust build script.
          export PATH="$HOME/.pub-cache/bin:$PATH"
          flutter config --enable-linux-desktop
          dart ./scripts/flutter_release_build/build_flowy.dart run . ${{ env.APP_VERSION }}

      - name: Verify ARM64 binary
        working-directory: frontend
        run: file appflowy_flutter/product/${{ env.APP_VERSION }}/linux/Release/AppFlowy/AppFlowy

      - name: Upload bundled app (tar.gz)
        working-directory: frontend
        run: |
          tar -czf appflowy-${{ env.APP_VERSION }}-linux-arm64.tar.gz \
            -C appflowy_flutter/product/${{ env.APP_VERSION }}/linux/Release AppFlowy
      - uses: actions/upload-artifact@v4
        with:
          name: appflowy-linux-arm64
          path: frontend/appflowy-${{ env.APP_VERSION }}-linux-arm64.tar.gz